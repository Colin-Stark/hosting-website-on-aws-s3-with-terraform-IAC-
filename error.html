<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b1020;
            color: #f8fafc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #26345d 0, #111936 32%, #0b1020 70%);
        }

        main {
            width: min(90%, 620px);
            padding: 3rem 2rem;
            text-align: center;
        }

        .code {
            margin: 0;
            font-size: clamp(7rem, 24vw, 13rem);
            line-height: .8;
            letter-spacing: -.08em;
            font-weight: 900;
            color: #8b5cf6;
            text-shadow: 0 0 45px rgb(139 92 246 / 45%);
        }

        h1 {
            margin: 2rem 0 .75rem;
            font-size: clamp(1.7rem, 5vw, 2.5rem);
        }

        p {
            margin: 0 auto 2rem;
            max-width: 430px;
            color: #aab5d1;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: .85rem 1.3rem;
            border-radius: .7rem;
            background: #f8fafc;
            color: #111936;
            font-weight: 700;
            text-decoration: none;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        a:hover,
        a:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgb(248 250 252 / 20%);
        }
    </style>
</head>

<body>
    <main>
        <div class="code" aria-hidden="true">404</div>
        <h1>Page not found</h1>
        <p>Sorry, we couldn't find the page you're looking for. It may have been moved or no longer exists.</p>
        <a href="/">Return home</a>
    </main>
</body>

</html>
